# XcodeGen spec — the Xcode project is generated from this file (CI runs `xcodegen generate`).
#   brew install xcodegen && cd ios && xcodegen generate && open Blith.xcodeproj
# Info.plist and Blith.entitlements are generated from the `info:` / `entitlements:` blocks below.
name: Blith

options:
  bundleIdPrefix: com.blith
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  BlithCore:
    path: BlithCore

targets:
  Blith:
    type: application
    platform: iOS
    sources:
      - path: Blith
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/Body3D/**"
      - path: Blith/Resources/Body3D
        buildPhase: resources
        optional: true
    dependencies:
      - package: BlithCore
        product: BlithCore
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
      - sdk: MapKit.framework
    entitlements:
      path: Blith/Resources/Blith.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Blith/Resources/Info.plist
      properties:
        CFBundleDisplayName: Blith
        CFBundleName: Blith
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Geist-Light.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - Geist-Bold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthUpdateUsageDescription: Blith saves walks you record with GPS in Blith to Apple Health, as a walking workout with its route and distance, so the rest of your health data stays complete. It never writes anything else, and it doesn't save a walk your Apple Watch already recorded.
        NSLocationWhenInUseUsageDescription: Blith uses your location only while you record a walk, to draw your route and measure distance, pace and splits. It stays on this iPhone and in Apple Health, and isn't sent anywhere else.
        NSMotionUsageDescription: Blith counts your steps and measures climb with the iPhone's motion sensor and barometer while you record a walk.
        NSLocationTemporaryUsageDescriptionDictionary:
          WalkTracking: Precise location lets Blith measure your walk's distance and draw its route accurately.
        UIBackgroundModes:
          - location
        NSHealthShareUsageDescription: Blith reads the health data you choose, such as steps, walking, workouts, sleep, weight and heart rate, to learn your personal baselines and explain how you're changing. Heart rate is also shown live on the Today screen. It's stored on this iPhone and never used for advertising.
        # AI configuration, supplied by Config/Secrets.xcconfig (gitignored) or CI.
        OPENROUTER_API_KEY: $(OPENROUTER_API_KEY)
        OPENROUTER_MODEL: $(OPENROUTER_MODEL)
        OPENROUTER_MODEL_QUICK: $(OPENROUTER_MODEL_QUICK)
        PRIVACY_POLICY_URL: $(PRIVACY_POLICY_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blith.health
        PRODUCT_NAME: Blith
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ENABLE_PREVIEWS: "YES"
    scheme:
      gatherCoverageData: false
