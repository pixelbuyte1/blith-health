<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blith 2.0 · Ask</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.bl{--base:#0C1014;--surface:#131920;--raised:#1A222B;--line:rgba(241,244,246,0.08);--line2:rgba(241,244,246,0.16);--t1:#F1F4F6;--t2:#A9B4BF;--t3:#97A3AF;--act:#D9CDB8;--actink:#0C1014;--primed:#3FD0B0;--steady:#F2B53E;--strained:#F0545E;--load:#4DA3F7;--sleep:#8C9BF0;--vitals:#7CCBE6;--deep:#4F67BD;--core:#7F95E3;--rem:#B5C4F5;--band:rgba(169,180,191,0.17);--track:rgba(241,244,246,0.07);--glass:rgba(24,31,39,0.74);--shadow:rgba(0,0,0,0.38);-webkit-font-smoothing:antialiased}
.bl[data-theme="light"]{--base:#F4F2EE;--surface:#FFFFFF;--raised:#ECE9E3;--line:rgba(18,23,27,0.08);--line2:rgba(18,23,27,0.16);--t1:#12171B;--t2:#4B5762;--t3:#5F6B76;--act:#12171B;--actink:#F4F2EE;--primed:#077A67;--steady:#946000;--strained:#C4283C;--load:#0B63C5;--sleep:#4F5FC4;--vitals:#16708F;--deep:#34489A;--core:#5F78D6;--rem:#9FB2EE;--band:rgba(75,87,98,0.13);--track:rgba(18,23,27,0.06);--glass:rgba(255,255,255,0.8);--shadow:rgba(18,23,27,0.12)}
.bl .n{font-stretch:75%;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.015em;line-height:0.86}
.bl .cap{font-size:12px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--t3)}
.bl button,.bl input{font-family:inherit}
.bl input::placeholder{color:var(--t3)}
</style>
</helmet>
<div class="bl" data-theme="{{theme}}" style="position: relative; width: 390px; height: 980px; overflow: hidden; box-sizing: border-box; padding: 62px 16px 0; background: var(--base); color: var(--t1); font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span class="cap">Answers from your own data</span>
<h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em">Ask</h1>
</div>
<button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line2); background: var(--surface); color: var(--t1); font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>Memory · 3</button>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{prompts}}" as="p" hint-placeholder-count="3">
<button style="min-height: 44px; padding: 10px 14px; border-radius: 16px; border: 1px solid var(--line2); background: var(--surface); color: var(--t1); font-size: 15px; text-align: left; line-height: 1.3; cursor: pointer">{{p.t}}</button>
</sc-for>
</div>

<div style="align-self: flex-end; max-width: 78%; padding: 12px 16px; border-radius: 20px 20px 6px 20px; background: var(--raised); font-size: 17px; line-height: 1.4">Should I train hard today?</div>

<section aria-label="Answer" style="display: flex; flex-direction: column; gap: 16px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; color: var(--t2)"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--act)"></span>Blith</span>
<p style="margin: 0; font-size: 20px; line-height: 1.35; font-weight: 650">Yes. A hard session fits today, but go easy on the knee.</p>
<div style="display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px 12px; align-items: baseline">
<sc-for list="{{answer}}" as="a" hint-placeholder-count="4">
<span class="cap">{{a.k}}</span>
<span style="font-size: 16px; line-height: 1.45; color: var(--t1)">{{a.v}}</span>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line)">
<span class="cap">Based on</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="4">
<span style="height: 28px; padding: 0 10px; border-radius: 8px; background: var(--raised); color: var(--t2); font-size: 13px; display: flex; align-items: center">{{s.t}}</span>
</sc-for>
</div>
<span style="font-size: 12px; color: var(--t3)">Compares you with you. Not medical advice.</span>
</div>
</section>

<form onSubmit="{{noop}}" style="position: absolute; left: 16px; right: 16px; bottom: 104px; height: 56px; box-sizing: border-box; padding: 6px 6px 6px 18px; border-radius: 28px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); border: 1px solid var(--line2); box-shadow: 0 12px 32px var(--shadow); display: flex; align-items: center; gap: 8px; margin: 0">
<label for="ask-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ask about your data</label>
<input id="ask-input" type="text" placeholder="Ask about your sleep, load, HRV…" style="flex: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; color: var(--t1); font-size: 17px">
<button type="submit" aria-label="Send" style="flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 22px; background: var(--act); color: var(--actink); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</form>

<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 64px; box-sizing: border-box; padding: 6px; border-radius: 32px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); border: 1px solid var(--line2); box-shadow: 0 12px 32px var(--shadow); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; background: {{t.bg}}; color: {{t.color}}; font-size: 11px; font-weight: 600; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const prompts = [
      { t: 'Why is my HRV up today?' },
      { t: 'How did late bedtimes affect my sleep?' },
      { t: 'Compare this week with last' }
    ];
    const answer = [
      { k: 'Today', v: 'Readiness 82, Primed. Above your usual 68–80.' },
      { k: 'Usual', v: 'HRV 58 ms against your usual 44–54. Sleep 7h 42m, your longest night this week.' },
      { k: 'Context', v: 'You noted a sore left knee 2 days ago.' },
      { k: 'Suggestion', v: 'Pick cycling or upper body over running until the knee settles. Aim for a load of 380–480.' }
    ];
    const sources = [{ t: 'Readiness · today' }, { t: 'HRV · 7 nights' }, { t: 'Sleep · 7 nights' }, { t: 'Note · left knee' }];
    const IC = {
      Today: 'M3 17h18M7 17a5 5 0 0 1 10 0M12 6v3M5.6 9.6l1.8 1.8M18.4 9.6l-1.8 1.8',
      Trends: 'M3 20h18M4 15l5-5 4 3 7-7',
      Sleep: 'M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79Z',
      Body: 'M12 3.5a2.2 2.2 0 1 0 0 4.4a2.2 2.2 0 1 0 0-4.4ZM6.5 10.5h11M12 10.5v4.5M12 15l-3 5.5M12 15l3 5.5',
      Ask: 'M4.5 5.5h15v10h-8.5l-4 3.5v-3.5h-2.5Z'
    };
    const files = { Today: 'Main.dc.html', Trends: 'Trends.dc.html', Sleep: 'Sleep.dc.html', Body: 'Body.dc.html', Ask: 'Ask.dc.html' };
    const ACTIVE = 'Ask';
    const tabs = Object.keys(IC).map((k) => ({ label: k, href: files[k], icon: IC[k], color: k === ACTIVE ? 'var(--t1)' : 'var(--t3)', bg: k === ACTIVE ? 'var(--line)' : 'transparent', current: k === ACTIVE ? 'page' : 'false' }));
    const noop = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    return { theme: this.props.theme ?? 'dark', prompts, answer, sources, tabs, noop };
  }
}
</script>
</body>
</html>
