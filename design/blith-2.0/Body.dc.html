<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blith 2.0 · Body</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.bl{--base:#0C1014;--surface:#131920;--raised:#1A222B;--line:rgba(241,244,246,0.08);--line2:rgba(241,244,246,0.16);--t1:#F1F4F6;--t2:#A9B4BF;--t3:#97A3AF;--act:#D9CDB8;--actink:#0C1014;--primed:#3FD0B0;--steady:#F2B53E;--strained:#F0545E;--load:#4DA3F7;--sleep:#8C9BF0;--vitals:#7CCBE6;--deep:#4F67BD;--core:#7F95E3;--rem:#B5C4F5;--band:rgba(169,180,191,0.17);--track:rgba(241,244,246,0.07);--glass:rgba(24,31,39,0.74);--shadow:rgba(0,0,0,0.38);-webkit-font-smoothing:antialiased}
.bl[data-theme="light"]{--base:#F4F2EE;--surface:#FFFFFF;--raised:#ECE9E3;--line:rgba(18,23,27,0.08);--line2:rgba(18,23,27,0.16);--t1:#12171B;--t2:#4B5762;--t3:#5F6B76;--act:#12171B;--actink:#F4F2EE;--primed:#077A67;--steady:#946000;--strained:#C4283C;--load:#0B63C5;--sleep:#4F5FC4;--vitals:#16708F;--deep:#34489A;--core:#5F78D6;--rem:#9FB2EE;--band:rgba(75,87,98,0.13);--track:rgba(18,23,27,0.06);--glass:rgba(255,255,255,0.8);--shadow:rgba(18,23,27,0.12)}
.bl .n{font-stretch:75%;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.015em;line-height:0.86}
.bl .cap{font-size:12px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--t3)}
.bl button{font-family:inherit}
</style>
</helmet>
<div class="bl" data-theme="{{theme}}" style="position: relative; width: 390px; height: 1560px; overflow: hidden; box-sizing: border-box; padding: 62px 16px 0; background: var(--base); color: var(--t1); font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-direction: column; gap: 4px">
<span class="cap">Notes and measurements</span>
<h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em">Body</h1>
</header>

<div role="group" aria-label="Layer" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 14px; background: var(--raised)">
<sc-for list="{{layers}}" as="l" hint-placeholder-count="2">
<button aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="height: 38px; border: 0; border-radius: 11px; background: {{l.bg}}; color: {{l.fg}}; font-size: 15px; font-weight: 650; cursor: pointer; box-shadow: {{l.sh}}">{{l.label}}</button>
</sc-for>
</div>

<section aria-label="3D body" style="position: relative; height: 440px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); overflow: hidden">
<svg width="186" height="400" viewBox="0 0 200 430" aria-hidden="true" style="position: absolute; left: 86px; top: 20px">
<ellipse cx="100" cy="34" rx="19" ry="23" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></ellipse>
<rect x="91" y="54" width="18" height="18" rx="6" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<rect x="44" y="76" width="18" height="98" rx="9" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<rect x="138" y="76" width="18" height="98" rx="9" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<rect x="40" y="172" width="16" height="84" rx="8" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<rect x="144" y="172" width="16" height="84" rx="8" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<circle cx="48" cy="264" r="9" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></circle>
<circle cx="152" cy="264" r="9" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></circle>
<rect x="72" y="214" width="26" height="110" rx="13" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<rect x="102" y="214" width="26" height="110" rx="13" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<rect x="74" y="326" width="22" height="90" rx="11" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<rect x="104" y="326" width="22" height="90" rx="11" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<ellipse cx="84" cy="420" rx="13" ry="6" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></ellipse>
<ellipse cx="116" cy="420" rx="13" ry="6" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></ellipse>
<rect x="64" y="70" width="72" height="112" rx="26" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<rect x="69" y="172" width="62" height="50" rx="20" style="fill: var(--raised); stroke: var(--line2); stroke-width: 1.2"></rect>
<circle cx="115" cy="326" r="17" style="fill: color-mix(in srgb, var(--act) 30%, transparent); stroke: var(--act); stroke-width: 1.6"></circle>
<circle cx="115" cy="326" r="4" style="fill: var(--act)"></circle>
</svg>
<div style="position: absolute; left: 214px; top: 296px; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line2)">
<span style="font-size: 13px; font-weight: 650">Left knee</span>
<span style="font-size: 12px; color: var(--t2)">Sore · 2 days</span>
</div>
<div role="group" aria-label="View" style="position: absolute; right: 12px; top: 12px; display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--raised)">
<button aria-pressed="true" style="height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: var(--surface); color: var(--t1); font-size: 13px; font-weight: 650">Front</button>
<button aria-pressed="false" style="height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--t2); font-size: 13px; font-weight: 650">Back</button>
</div>
<span style="position: absolute; left: 16px; bottom: 14px; font-size: 12px; color: var(--t3)">{{layerHint}}</span>
</section>

<section aria-label="Notes" style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span class="cap">Notes</span>
<span style="font-size: 13px; color: var(--t3)">2 open</span>
</div>
<div style="border-radius: 22px; background: var(--surface); border: 1px solid var(--line); overflow: hidden">
<sc-for list="{{notes}}" as="n" hint-placeholder-count="2">
<button style="width: 100%; text-align: left; display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 0; border-top: {{n.sep}}; background: transparent; color: var(--t1); cursor: pointer">
<span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--raised); display: flex; align-items: center; justify-content: center; color: var(--act)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21ZM12 8.5a2 2 0 1 0 0 4a2 2 0 1 0 0-4Z"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 17px; font-weight: 650">{{n.region}}</span>
<span style="font-size: 15px; color: var(--t2)">{{n.text}}</span>
</span>
<span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="font-size: 13px; color: var(--t3)">{{n.when}}</span>
<span aria-label="{{n.sevLabel}}" style="display: flex; gap: 3px">
<sc-for list="{{n.sev}}" as="s" hint-placeholder-count="5">
<span style="width: 8px; height: 8px; box-sizing: border-box; border-radius: 2px; background: {{s.bg}}; border: {{s.bd}}"></span>
</sc-for>
</span>
</span>
</button>
</sc-for>
</div>
<button style="height: 52px; border: 0; border-radius: 26px; background: var(--act); color: var(--actink); font-size: 17px; font-weight: 650; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a note</button>
</section>

<section aria-label="Measurements" style="display: flex; flex-direction: column; gap: 12px">
<span class="cap">Measurements</span>
<div style="border-radius: 22px; background: var(--surface); border: 1px solid var(--line); overflow: hidden">
<sc-for list="{{measures}}" as="m" hint-placeholder-count="4">
<div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; border-top: {{m.sep}}">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<span style="font-size: 15px; color: var(--t2)">{{m.name}}</span>
<span style="font-size: 13px; color: var(--t3); white-space: nowrap">{{m.usual}}</span>
</div>
<span style="display: flex; align-items: baseline; gap: 5px"><span class="n" style="font-size: 32px">{{m.value}}</span><span style="font-size: 14px; color: var(--t3)">{{m.unit}}</span></span>
<sc-if value="{{m.hasBar}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; height: 10px">
<div style="position: absolute; left: 0; right: 0; top: 3px; height: 4px; border-radius: 2px; background: var(--track)"></div>
<div style="position: absolute; left: {{m.bar.bandL}}; width: {{m.bar.bandW}}; top: 1px; height: 8px; border-radius: 4px; background: var(--band)"></div>
<div style="position: absolute; left: {{m.bar.mark}}; top: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 5px; background: {{m.color}}; box-shadow: 0 0 0 2px var(--surface)"></div>
</div>
</sc-if>
</div>
</sc-for>
</div>
<p style="margin: 0; font-size: 12px; line-height: 1.45; color: var(--t3)">Anatomy for orientation and notes, not diagnosis. Models: BodyParts3D and Z-Anatomy, CC BY-SA.</p>
</section>

<nav aria-label="Tabs" style="position: absolute; left: 16px; right: 16px; bottom: 28px; height: 64px; box-sizing: border-box; padding: 6px; border-radius: 32px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); border: 1px solid var(--line2); box-shadow: 0 12px 32px var(--shadow); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 26px; background: {{t.bg}}; color: {{t.color}}; font-size: 11px; font-weight: 600; text-decoration: none">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const layer = st.layer || 'Muscle';
    const layers = ['Skin', 'Muscle'].map((l) => ({
      label: l,
      pressed: l === layer ? 'true' : 'false',
      bg: l === layer ? 'var(--surface)' : 'transparent',
      fg: l === layer ? 'var(--t1)' : 'var(--t2)',
      sh: l === layer ? '0 1px 2px var(--shadow)' : 'none',
      pick: () => this.setState({ layer: l })
    }));
    const layerHint = layer === 'Muscle' ? 'Muscle layer · tap a muscle to name it' : 'Skin · drag to turn, tap to add a note';
    const sevOf = (k) => [1, 2, 3, 4, 5].map((i) => ({ bg: i <= k ? 'var(--act)' : 'transparent', bd: i <= k ? '0' : '1px solid var(--line2)' }));
    const notes = [
      { region: 'Left knee', text: 'Sore after Sunday’s run', when: '2 days', sev: sevOf(2), sevLabel: 'Severity 2 of 5' },
      { region: 'Lower back', text: 'Tight after a long desk day', when: 'Today', sev: sevOf(1), sevLabel: 'Severity 1 of 5' }
    ].map((n, i) => ({ ...n, sep: i === 0 ? '0' : '1px solid var(--line)' }));
    const pct = (v, min, max) => (Math.max(0, Math.min(1, (v - min) / (max - min))) * 100).toFixed(1) + '%';
    const range = (lo, hi, v, min, max) => ({ bandL: pct(lo, min, max), bandW: ((hi - lo) / (max - min) * 100).toFixed(1) + '%', mark: pct(v, min, max) });
    const measures = [
      { name: 'Weight', value: '78.4', unit: 'kg', usual: '30-day range 77.9–79.1', color: 'var(--t1)', hasBar: true, bar: range(77.9, 79.1, 78.4, 76, 81) },
      { name: 'Cardio fitness (VO₂ max)', value: '46.2', unit: 'ml/kg/min', usual: 'Usual 45.0–47.0', color: 'var(--vitals)', hasBar: true, bar: range(45, 47, 46.2, 42, 50) },
      { name: 'Walking speed', value: '5.1', unit: 'km/h', usual: 'Usual 4.8–5.3', color: 'var(--load)', hasBar: true, bar: range(4.8, 5.3, 5.1, 4, 6) },
      { name: 'Walking steadiness', value: 'OK', unit: 'from Apple Health', usual: 'Last checked Sunday', color: 'var(--t1)', hasBar: false, bar: range(0, 0, 0, 0, 1) }
    ].map((m, i) => ({ ...m, sep: i === 0 ? '0' : '1px solid var(--line)' }));

    const IC = {
      Today: 'M3 17h18M7 17a5 5 0 0 1 10 0M12 6v3M5.6 9.6l1.8 1.8M18.4 9.6l-1.8 1.8',
      Trends: 'M3 20h18M4 15l5-5 4 3 7-7',
      Sleep: 'M21 12.79A9 9 0 1 1 11.21 3A7 7 0 0 0 21 12.79Z',
      Body: 'M12 3.5a2.2 2.2 0 1 0 0 4.4a2.2 2.2 0 1 0 0-4.4ZM6.5 10.5h11M12 10.5v4.5M12 15l-3 5.5M12 15l3 5.5',
      Ask: 'M4.5 5.5h15v10h-8.5l-4 3.5v-3.5h-2.5Z'
    };
    const files = { Today: 'Main.dc.html', Trends: 'Trends.dc.html', Sleep: 'Sleep.dc.html', Body: 'Body.dc.html', Ask: 'Ask.dc.html' };
    const ACTIVE = 'Body';
    const tabs = Object.keys(IC).map((k) => ({ label: k, href: files[k], icon: IC[k], color: k === ACTIVE ? 'var(--t1)' : 'var(--t3)', bg: k === ACTIVE ? 'var(--line)' : 'transparent', current: k === ACTIVE ? 'page' : 'false' }));
    return { theme: this.props.theme ?? 'dark', layers, layerHint, notes, measures, tabs };
  }
}
</script>
</body>
</html>
